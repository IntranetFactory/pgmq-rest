name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgmq:
        image: tembo.docker.scarf.sh/tembo/pg17-pgmq:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start pgmq-rest server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          DB_POOL_SIZE: 20
        run: |
          deno run --allow-env --allow-net src/index.ts &
          echo "Server PID: $!"

      - name: Wait for pgmq-rest to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/ > /dev/null; then
              echo "pgmq-rest is ready"
              exit 0
            fi
            echo "Waiting for pgmq-rest to be ready..."
            sleep 1
          done
          echo "pgmq-rest failed to start"
          exit 1

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: postgres
          DB_POOL_SIZE: 20
          API_URL: http://localhost:8080/api/v1
        run: deno test --allow-env --allow-net src/index.test.ts
