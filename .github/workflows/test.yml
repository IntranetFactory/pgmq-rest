name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check src/index.ts src/db.ts src/types.ts src/dev.ts

  test:
    runs-on: ubuntu-latest
    if: ${{ vars.DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Start dev server
        run: |
          DATABASE_URL="${{ vars.DATABASE_URL }}" deno task dev &
          for i in {1..30}; do
            if curl -s http://localhost:8080/ > /dev/null; then
              echo "pgmq-rest is ready"
              break
            fi
            echo "Waiting for pgmq-rest to be ready..."
            sleep 1
          done

      - name: Run tests
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL }}
        run: deno task test

